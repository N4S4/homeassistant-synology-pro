create_snapshot:
  name: Create Snapshot
  description: Create a snapshot of a shared folder on the Synology NAS.
  fields:
    share:
      name: Shared Folder
      description: Name of the shared folder to snapshot.
      required: true
      example: "photos"
      selector:
        text:
    description:
      name: Description
      description: Optional description for the snapshot.
      required: false
      example: "Pre-update backup"
      selector:
        text:

delete_snapshot:
  name: Delete Snapshot
  description: Delete a snapshot of a shared folder.
  fields:
    share:
      name: Shared Folder
      description: Name of the shared folder.
      required: true
      example: "photos"
      selector:
        text:
    snapshot_name:
      name: Snapshot Name
      description: Name of the snapshot to delete.
      required: true
      example: "GMT+01-2025-01-15-10-30-00"
      selector:
        text:

restart_container:
  name: Restart Container
  description: Restart a Docker container on the Synology NAS.
  fields:
    container_id:
      name: Container ID
      description: ID or name of the Docker container to restart.
      required: true
      example: "plex"
      selector:
        text:

update_container:
  name: Update Container
  description: Pull the latest image and recreate a Docker container.
  fields:
    container_id:
      name: Container ID
      description: ID or name of the Docker container to update.
      required: true
      example: "plex"
      selector:
        text:

run_security_scan:
  name: Run Security Scan
  description: Trigger a Security Advisor scan on the Synology NAS.

create_vm_snapshot:
  name: Create VM Snapshot
  description: Create a snapshot of a virtual machine (VMM) on the Synology NAS.
  fields:
    vm_name:
      name: VM Name
      description: Name of the virtual machine to snapshot.
      required: true
      example: "proxmox"
      selector:
        text:
    description:
      name: Description
      description: Optional description for the snapshot.
      required: false
      example: "Pre-update backup"
      selector:
        text:

delete_vm_snapshot:
  name: Delete VM Snapshot
  description: Delete a snapshot of a virtual machine.
  fields:
    vm_name:
      name: VM Name
      description: Name of the virtual machine.
      required: true
      example: "proxmox"
      selector:
        text:
    snapshot_id:
      name: Snapshot ID
      description: Snapshot ID to delete (from the snapshot list).
      required: true
      example: "04dc2bc8-...-gsnap-1234567"
      selector:
        text:

list_vm_snapshots:
  name: List VM Snapshots
  description: List the snapshots of a virtual machine.
  fields:
    vm_name:
      name: VM Name
      description: Name of the virtual machine.
      required: true
      example: "proxmox"
      selector:
        text:

restore_vm_snapshot:
  name: Restore VM Snapshot
  description: Restore a virtual machine from a snapshot.
  fields:
    vm_name:
      name: VM Name
      description: Name of the virtual machine.
      required: true
      example: "proxmox"
      selector:
        text:
    snapshot_id:
      name: Snapshot ID
      description: Snapshot ID to restore from.
      required: true
      example: "04dc2bc8-...-gsnap-1234567"
      selector:
        text:
